<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Bell curve divided into three coloured zones. Left zone in orange represents mediocrity (below minus one standard deviation). Centre zone in purple represents average ability. Right zone in green represents expertise (above plus one standard deviation).</desc>
