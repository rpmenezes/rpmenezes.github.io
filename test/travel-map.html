<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map – Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f6f7;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            color: #007D69;
            margin-bottom: 0.3rem;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        #map-wrap {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 2rem 2rem 1.5rem;
        }

        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .stat { text-align: center; }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 300;
            color: #007D69;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.68rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-top: 0.3rem;
        }

        #map-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .country { transition: opacity 0.15s ease; }
        .country:hover { opacity: 0.72; cursor: default; }

        .legend {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.78rem;
            color: #777;
        }

        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* Projection switcher */
        .proj-switcher {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 1px solid #f0f0f0;
        }

        .proj-label {
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }

        .proj-btn {
            padding: 0.28rem 0.85rem;
            border: 1.5px solid #d0d0d0;
            border-radius: 999px;
            background: #fff;
            font-size: 0.72rem;
            color: #777;
            cursor: pointer;
            transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
            font-family: inherit;
        }

        .proj-btn:hover {
            border-color: #007D69;
            color: #007D69;
        }

        .proj-btn.active {
            background: #007D69;
            border-color: #007D69;
            color: #fff;
        }

        #tooltip {
            position: fixed;
            background: #fff;
            border: 1px solid #d0e8e4;
            border-left: 3px solid #007D69;
            border-radius: 4px;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            color: #333;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .tooltip-cat     { color: #007D69; font-style: italic; }
        .tooltip-unknown { color: #aaa;    font-style: italic; }
    </style>
</head>
<body>

    <h1>Places in the World</h1>
    <p class="subtitle">Hover any country for its name</p>

    <div id="map-wrap">
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="been-count">—</div>
                <div class="stat-label">Countries Visited</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="want-count">—</div>
                <div class="stat-label">On the List</div>
            </div>
        </div>

        <svg id="map-svg" viewBox="0 0 960 500"></svg>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-swatch" style="background:#007D69;"></div>
                <span>Been</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#a8d5cc;"></div>
                <span>Want to Go</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#e4e4e4;"></div>
                <span>Not yet</span>
            </div>
        </div>

        <div class="proj-switcher">
            <div class="proj-label">Projection</div>
        </div>
    </div>

    <div id="tooltip"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="https://unpkg.com/d3-geo-projection@4/dist/d3-geo-projection.min.js"></script>
    <script>
    // All country names (ISO 3166-1 numeric → display name)
    const ALL_NAMES = {
        4:'Afghanistan', 8:'Albania', 12:'Algeria', 24:'Angola', 32:'Argentina',
        36:'Australia', 40:'Austria', 50:'Bangladesh', 56:'Belgium', 64:'Bhutan',
        68:'Bolivia', 70:'Bosnia and Herzegovina', 72:'Botswana', 76:'Brazil',
        84:'Belize', 100:'Bulgaria', 104:'Myanmar', 108:'Burundi', 116:'Cambodia',
        120:'Cameroon', 124:'Canada', 140:'Central African Republic', 144:'Sri Lanka',
        152:'Chile', 156:'China', 170:'Colombia', 178:'Republic of Congo',
        180:'DR Congo', 188:'Costa Rica', 191:'Croatia', 192:'Cuba', 196:'Cyprus',
        203:'Czechia', 204:'Benin', 208:'Denmark', 214:'Dominican Republic',
        218:'Ecuador', 222:'El Salvador', 226:'Equatorial Guinea', 231:'Ethiopia',
        232:'Eritrea', 233:'Estonia', 238:'Falkland Islands', 242:'Fiji',
        246:'Finland', 250:'France', 266:'Gabon', 276:'Germany', 288:'Ghana',
        300:'Greece', 304:'Greenland', 320:'Guatemala', 324:'Guinea',
        328:'Guyana', 332:'Haiti', 340:'Honduras', 348:'Hungary', 356:'India',
        360:'Indonesia', 364:'Iran', 368:'Iraq', 372:'Ireland', 376:'Israel',
        380:'Italy', 388:'Jamaica', 392:'Japan', 398:'Kazakhstan', 400:'Jordan',
        404:'Kenya', 408:'North Korea', 410:'South Korea', 418:'Laos',
        422:'Lebanon', 426:'Lesotho', 428:'Latvia', 430:'Liberia', 434:'Libya',
        440:'Lithuania', 450:'Madagascar', 454:'Malawi', 458:'Malaysia',
        466:'Mali', 478:'Mauritania', 484:'Mexico', 496:'Mongolia', 499:'Montenegro',
        504:'Morocco', 508:'Mozambique', 516:'Namibia', 524:'Nepal',
        528:'Netherlands', 540:'New Caledonia', 554:'New Zealand', 558:'Nicaragua',
        562:'Niger', 566:'Nigeria', 578:'Norway', 586:'Pakistan', 591:'Panama',
        598:'Papua New Guinea', 600:'Paraguay', 604:'Peru', 608:'Philippines',
        616:'Poland', 620:'Portugal', 624:'Guinea-Bissau', 634:'Qatar',
        642:'Romania', 643:'Russia', 646:'Rwanda', 682:'Saudi Arabia',
        686:'Senegal', 688:'Serbia', 694:'Sierra Leone', 703:'Slovakia',
        705:'Slovenia', 706:'Somalia', 710:'South Africa', 716:'Zimbabwe',
        724:'Spain', 728:'South Sudan', 729:'Sudan', 740:'Suriname',
        752:'Sweden', 756:'Switzerland', 760:'Syria', 762:'Tajikistan',
        764:'Thailand', 780:'Trinidad and Tobago', 788:'Tunisia', 792:'Turkey',
        800:'Uganda', 804:'Ukraine', 784:'United Arab Emirates',
        807:'North Macedonia', 818:'Egypt', 826:'United Kingdom',
        834:'Tanzania', 840:'United States', 858:'Uruguay', 860:'Uzbekistan',
        862:'Venezuela', 704:'Vietnam', 887:'Yemen', 894:'Zambia',
        352:'Iceland', 44:'Bahamas'
    };

    // Available projections (name → factory function)
    const PROJECTIONS = {
        'Natural Earth':  () => d3.geoNaturalEarth1(),
        'Equal Earth':    () => d3.geoEqualEarth(),
        'Robinson':       () => d3.geoRobinson(),
        'Winkel Tripel':  () => d3.geoWinkel3(),
        'Mollweide':      () => d3.geoMollweide(),
        'Patterson':      () => d3.geoPatterson(),
        'Mercator':       () => d3.geoMercator(),
        'Orthographic':   () => d3.geoOrthographic(),
    };

    const DEFAULT_PROJ = 'Natural Earth';
    const W = 960, H = 500;
    const PAD = [[16, 16], [944, 484]];

    function makePathFn(projName) {
        const proj = PROJECTIONS[projName]().fitExtent(PAD, { type: 'Sphere' });
        return d3.geoPath().projection(proj);
    }

    const svg = d3.select('#map-svg');
    const tip = document.getElementById('tooltip');

    // Store refs for updates
    let gratElem, borderElem;
    let graticuleDatum, bordersDatum, countryFeatures;
    let been, wantToGo;

    function updatePaths(projName) {
        const pathFn = makePathFn(projName);
        gratElem.attr('d', pathFn(graticuleDatum));
        svg.selectAll('.country').attr('d', pathFn);
        borderElem.attr('d', pathFn(bordersDatum));
    }

    function switchTo(projName) {
        document.querySelectorAll('.proj-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.proj === projName));

        svg.transition().duration(220).attr('opacity', 0)
            .end()
            .then(() => {
                updatePaths(projName);
                svg.transition().duration(380).attr('opacity', 1);
            });
    }

    // Build switcher buttons
    const switcher = document.querySelector('.proj-switcher');
    Object.keys(PROJECTIONS).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'proj-btn' + (name === DEFAULT_PROJ ? ' active' : '');
        btn.dataset.proj = name;
        btn.textContent = name;
        btn.addEventListener('click', () => switchTo(name));
        switcher.appendChild(btn);
    });

    // Load data
    Promise.all([
        d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'),
        d3.json('countries.json?v=' + Date.now())
    ]).then(([world, userCountries]) => {

        been     = new Set();
        wantToGo = new Set();
        userCountries.forEach(c => {
            if (c.category === 'been') been.add(c.id);
            if (c.category === 'want') wantToGo.add(c.id);
        });

        document.getElementById('been-count').textContent = been.size;
        document.getElementById('want-count').textContent = wantToGo.size;

        countryFeatures = topojson.feature(world, world.objects.countries);
        bordersDatum    = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
        graticuleDatum  = d3.geoGraticule()();

        const initPath = makePathFn(DEFAULT_PROJ);

        // Graticule
        gratElem = svg.append('path')
            .datum(graticuleDatum)
            .attr('class', 'graticule')
            .attr('d', initPath)
            .attr('fill', 'none')
            .attr('stroke', '#f0f0f0')
            .attr('stroke-width', 0.4);

        // Countries
        svg.selectAll('.country')
            .data(countryFeatures.features)
            .join('path')
            .attr('class', 'country')
            .attr('d', initPath)
            .attr('fill', d => {
                const id = +d.id;
                if (been.has(id))     return '#007D69';
                if (wantToGo.has(id)) return '#a8d5cc';
                return '#e4e4e4';
            })
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.4)
            .attr('opacity', 0)
            .on('mousemove', function(event, d) {
                const id   = +d.id;
                const name = ALL_NAMES[id] || 'Unknown territory';
                let catHtml = '';
                if (been.has(id))
                    catHtml = ' <span class="tooltip-cat">· Been</span>';
                else if (wantToGo.has(id))
                    catHtml = ' <span class="tooltip-cat">· Want to Go</span>';
                else if (!ALL_NAMES[id])
                    catHtml = ' <span class="tooltip-unknown">· uncharted</span>';
                tip.innerHTML = name + catHtml;
                tip.style.opacity = 1;
                tip.style.left = (event.clientX + 14) + 'px';
                tip.style.top  = (event.clientY - 32) + 'px';
            })
            .on('mouseleave', () => { tip.style.opacity = 0; });

        // Staggered entrance: grey → teal → green
        svg.selectAll('.country')
            .transition()
            .duration(700)
            .delay(d => {
                const id = +d.id;
                if (been.has(id))     return 2 * 320 + Math.random() * 180;
                if (wantToGo.has(id)) return 1 * 320 + Math.random() * 180;
                return Math.random() * 180;
            })
            .attr('opacity', 1);

        // Border mesh
        borderElem = svg.append('path')
            .datum(bordersDatum)
            .attr('class', 'borders')
            .attr('fill', 'none')
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.4)
            .attr('d', initPath);
    });
    </script>
</body>
</html>
