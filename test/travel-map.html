<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map – Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f6f7;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            color: #007D69;
            margin-bottom: 0.3rem;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        #map-wrap {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 2rem 2rem 1.5rem;
        }

        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .stat { text-align: center; }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 300;
            color: #007D69;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.68rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-top: 0.3rem;
        }

        #map-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .country { transition: opacity 0.15s ease; }
        .country.has-data:hover { opacity: 0.72; cursor: default; }

        .legend {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.78rem;
            color: #777;
        }

        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        #tooltip {
            position: fixed;
            background: #fff;
            border: 1px solid #d0e8e4;
            border-left: 3px solid #007D69;
            border-radius: 4px;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            color: #333;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .tooltip-cat {
            color: #007D69;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Places in the World</h1>
    <p class="subtitle">Hover a country for details</p>

    <div id="map-wrap">
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="been-count">—</div>
                <div class="stat-label">Countries Visited</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="want-count">—</div>
                <div class="stat-label">On the List</div>
            </div>
        </div>

        <svg id="map-svg" viewBox="0 0 960 500"></svg>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-swatch" style="background:#007D69;"></div>
                <span>Been</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#a8d5cc;"></div>
                <span>Want to Go</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#e4e4e4;"></div>
                <span>Not yet</span>
            </div>
        </div>
    </div>

    <div id="tooltip"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
    <script>
    // ISO 3166-1 numeric codes
    const been = new Set([
        // South America
        76,   // Brazil
        218,  // Ecuador
        32,   // Argentina
        170,  // Colombia
        858,  // Uruguay
        // Caribbean
        192,  // Cuba
        388,  // Jamaica
        214,  // Dominican Republic
        44,   // Bahamas
        // North America
        124,  // Canada
        840,  // United States
        484,  // Mexico
        // Europe
        191,  // Croatia
        380,  // Italy
        620,  // Portugal
        724,  // Spain
        250,  // France
        276,  // Germany
        56,   // Belgium
        528,  // Netherlands
        208,  // Denmark
        703,  // Slovakia
        826,  // United Kingdom
        203,  // Czechia
        300,  // Greece
        196,  // Cyprus
        616,  // Poland
        372,  // Ireland
        642,  // Romania
        348,  // Hungary
        40,   // Austria
        756,  // Switzerland
        // Africa
        834,  // Tanzania
        800,  // Uganda
        404,  // Kenya
        // Asia
        792,  // Turkey
        356,  // India
        704,  // Vietnam
        818,  // Egypt
        156,  // China
        410,  // South Korea
    ]);

    const wantToGo = new Set([
        764,  // Thailand
        392,  // Japan
        242,  // Fiji
        524,  // Nepal
        188,  // Costa Rica
        578,  // Norway
        752,  // Sweden
        352,  // Iceland
        8,    // Albania
        233,  // Estonia
        246,  // Finland
        36,   // Australia
        554,  // New Zealand
        152,  // Chile
        504,  // Morocco
        710,  // South Africa
    ]);

    // Tooltip names
    const names = {
        76:'Brazil', 218:'Ecuador', 32:'Argentina', 170:'Colombia', 858:'Uruguay',
        192:'Cuba', 388:'Jamaica', 214:'Dominican Republic', 44:'Bahamas',
        124:'Canada', 840:'United States', 484:'Mexico',
        191:'Croatia', 380:'Italy', 620:'Portugal', 724:'Spain', 250:'France',
        276:'Germany', 56:'Belgium', 528:'Netherlands', 208:'Denmark', 703:'Slovakia',
        826:'United Kingdom', 203:'Czechia', 300:'Greece', 196:'Cyprus', 616:'Poland',
        372:'Ireland', 642:'Romania', 348:'Hungary', 40:'Austria', 756:'Switzerland',
        834:'Tanzania', 800:'Uganda', 404:'Kenya',
        792:'Turkey', 356:'India', 704:'Vietnam', 818:'Egypt', 156:'China', 410:'South Korea',
        764:'Thailand', 392:'Japan', 242:'Fiji', 524:'Nepal', 188:'Costa Rica',
        578:'Norway', 752:'Sweden', 352:'Iceland', 8:'Albania', 233:'Estonia', 246:'Finland',
        36:'Australia', 554:'New Zealand', 152:'Chile', 504:'Morocco', 710:'South Africa',
    };

    document.getElementById('been-count').textContent = been.size;
    document.getElementById('want-count').textContent = wantToGo.size;

    const WIDTH = 960, HEIGHT = 500;

    const projection = d3.geoNaturalEarth1()
        .scale(155)
        .translate([WIDTH / 2, HEIGHT / 2]);

    const path = d3.geoPath().projection(projection);
    const svg  = d3.select('#map-svg');
    const tip  = document.getElementById('tooltip');

    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
        const countries = topojson.feature(world, world.objects.countries);

        // Graticule grid
        const graticule = d3.geoGraticule();
        svg.append('path')
            .datum(graticule())
            .attr('d', path)
            .attr('fill', 'none')
            .attr('stroke', '#f0f0f0')
            .attr('stroke-width', 0.4);

        // Countries
        const paths = svg.selectAll('.country')
            .data(countries.features)
            .join('path')
            .attr('class', d => {
                const id = +d.id;
                return 'country' + (been.has(id) || wantToGo.has(id) ? ' has-data' : '');
            })
            .attr('d', path)
            .attr('fill', d => {
                const id = +d.id;
                if (been.has(id))      return '#007D69';
                if (wantToGo.has(id))  return '#a8d5cc';
                return '#e4e4e4';
            })
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.4)
            .attr('opacity', 0)
            .on('mousemove', function(event, d) {
                const id = +d.id;
                const name = names[id];
                if (!name) return;
                const cat = been.has(id) ? 'Been' : 'Want to Go';
                tip.innerHTML = `${name} <span class="tooltip-cat">· ${cat}</span>`;
                tip.style.opacity = 1;
                tip.style.left = (event.clientX + 14) + 'px';
                tip.style.top  = (event.clientY - 32) + 'px';
            })
            .on('mouseleave', () => { tip.style.opacity = 0; });

        // Staggered fade-in by category: unvisited first, want-to-go next, been last
        const order = d => {
            const id = +d.id;
            if (been.has(id))     return 2;
            if (wantToGo.has(id)) return 1;
            return 0;
        };

        paths.transition()
            .duration(700)
            .delay(d => order(d) * 320 + Math.random() * 180)
            .attr('opacity', 1);

        // Country border mesh on top
        svg.append('path')
            .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
            .attr('fill', 'none')
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.4)
            .attr('d', path);
    });
    </script>
</body>
</html>
