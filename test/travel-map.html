<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map – Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f6f7;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            color: #007D69;
            margin-bottom: 0.3rem;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        #map-wrap {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 2rem 2rem 1.5rem;
        }

        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .stat { text-align: center; }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 300;
            color: #007D69;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.68rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-top: 0.3rem;
        }

        #map-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .country { transition: opacity 0.15s ease; }
        .country:hover { opacity: 0.72; cursor: default; }

        .legend {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.78rem;
            color: #777;
        }

        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* Projection switcher */
        .proj-switcher {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 1px solid #f0f0f0;
        }

        .proj-label {
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }

        .proj-btn {
            padding: 0.28rem 0.85rem;
            border: 1.5px solid #d0d0d0;
            border-radius: 999px;
            background: #fff;
            font-size: 0.72rem;
            color: #777;
            cursor: pointer;
            transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
            font-family: inherit;
        }

        .proj-btn:hover {
            border-color: #007D69;
            color: #007D69;
        }

        .proj-btn.active {
            background: #007D69;
            border-color: #007D69;
            color: #fff;
        }

        #tooltip {
            position: fixed;
            background: #fff;
            border: 1px solid #d0e8e4;
            border-left: 3px solid #007D69;
            border-radius: 4px;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            color: #333;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .tooltip-cat     { color: #007D69; font-style: italic; }
        .tooltip-unknown { color: #aaa;    font-style: italic; }
    </style>
</head>
<body>

    <h1>Places in the World</h1>
    <p class="subtitle">Hover any country for its name</p>

    <div id="map-wrap">
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="been-count">—</div>
                <div class="stat-label">Countries Visited</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="want-count">—</div>
                <div class="stat-label">On the List</div>
            </div>
        </div>

        <svg id="map-svg" viewBox="0 0 960 500"></svg>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-swatch" style="background:#007D69;"></div>
                <span>Been</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#a8d5cc;"></div>
                <span>Want to Go</span>
            </div>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#e4e4e4;"></div>
                <span>Not yet</span>
            </div>
        </div>

        <div class="proj-switcher">
            <div class="proj-label">Projection</div>
        </div>
    </div>

    <div id="tooltip"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="https://unpkg.com/d3-geo-projection@4/dist/d3-geo-projection.min.js"></script>
    <script>
    // Country names are fetched dynamically from REST Countries API
    // (ISO 3166-1 numeric → common name), built at load time
    let ALL_NAMES = {};

    // Available projections (name → factory function)
    const PROJECTIONS = {
        'Natural Earth':  () => d3.geoNaturalEarth1(),
        'Equal Earth':    () => d3.geoEqualEarth(),
        'Robinson':       () => d3.geoRobinson(),
        'Winkel Tripel':  () => d3.geoWinkel3(),
        'Mollweide':      () => d3.geoMollweide(),
        'Patterson':      () => d3.geoPatterson(),
        'Mercator':       () => d3.geoMercator(),
        'Orthographic':   () => d3.geoOrthographic(),
    };

    const DEFAULT_PROJ = 'Natural Earth';
    const W = 960, H = 500;
    const PAD = [[16, 16], [944, 484]];

    function makePathFn(projName) {
        const proj = PROJECTIONS[projName]().fitExtent(PAD, { type: 'Sphere' });
        return d3.geoPath().projection(proj);
    }

    const svg = d3.select('#map-svg');
    const tip = document.getElementById('tooltip');

    // Store refs for updates
    let gratElem, borderElem;
    let graticuleDatum, bordersDatum, countryFeatures;
    let been, wantToGo;

    function updatePaths(projName) {
        const pathFn = makePathFn(projName);
        gratElem.attr('d', pathFn(graticuleDatum));
        svg.selectAll('.country').attr('d', pathFn);
        borderElem.attr('d', pathFn(bordersDatum));
    }

    function switchTo(projName) {
        document.querySelectorAll('.proj-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.proj === projName));

        svg.transition().duration(220).attr('opacity', 0)
            .end()
            .then(() => {
                updatePaths(projName);
                svg.transition().duration(380).attr('opacity', 1);
            });
    }

    // Build switcher buttons
    const switcher = document.querySelector('.proj-switcher');
    Object.keys(PROJECTIONS).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'proj-btn' + (name === DEFAULT_PROJ ? ' active' : '');
        btn.dataset.proj = name;
        btn.textContent = name;
        btn.addEventListener('click', () => switchTo(name));
        switcher.appendChild(btn);
    });

    // Load data
    Promise.all([
        d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'),
        d3.json('../data/manual/countries.json?v=' + Date.now()),
        fetch('https://restcountries.com/v3.1/all?fields=name,ccn3')
            .then(r => r.json())
            .catch(() => [])
    ]).then(([world, userCountries, restCountries]) => {

        // Build ISO numeric → common name lookup from REST Countries
        restCountries.forEach(c => {
            const id = parseInt(c.ccn3, 10);
            if (id) ALL_NAMES[id] = c.name.common;
        });
        // Antarctica is not a sovereign state so the API omits it
        if (!ALL_NAMES[10]) ALL_NAMES[10] = 'Antarctica';

        been     = new Set();
        wantToGo = new Set();
        userCountries.forEach(c => {
            if (c.category === 'been') been.add(c.id);
            if (c.category === 'want') wantToGo.add(c.id);
        });

        document.getElementById('been-count').textContent = been.size;
        document.getElementById('want-count').textContent = wantToGo.size;

        countryFeatures = topojson.feature(world, world.objects.countries);
        bordersDatum    = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
        graticuleDatum  = d3.geoGraticule()();

        const initPath = makePathFn(DEFAULT_PROJ);

        // Graticule
        gratElem = svg.append('path')
            .datum(graticuleDatum)
            .attr('class', 'graticule')
            .attr('d', initPath)
            .attr('fill', 'none')
            .attr('stroke', '#f0f0f0')
            .attr('stroke-width', 0.4);

        // Countries
        svg.selectAll('.country')
            .data(countryFeatures.features)
            .join('path')
            .attr('class', 'country')
            .attr('d', initPath)
            .attr('fill', d => {
                const id = +d.id;
                if (been.has(id))     return '#007D69';
                if (wantToGo.has(id)) return '#a8d5cc';
                return '#e4e4e4';
            })
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.4)
            .attr('opacity', 0)
            .on('mousemove', function(event, d) {
                const id   = +d.id;
                const name = ALL_NAMES[id] || 'Unknown territory';
                let catHtml = '';
                if (been.has(id))
                    catHtml = ' <span class="tooltip-cat">· Been</span>';
                else if (wantToGo.has(id))
                    catHtml = ' <span class="tooltip-cat">· Want to Go</span>';
                else if (!ALL_NAMES[id])
                    catHtml = ' <span class="tooltip-unknown">· uncharted</span>';
                tip.innerHTML = name + catHtml;
                tip.style.opacity = 1;
                tip.style.left = (event.clientX + 14) + 'px';
                tip.style.top  = (event.clientY - 32) + 'px';
            })
            .on('mouseleave', () => { tip.style.opacity = 0; });

        // Staggered entrance: grey → teal → green
        svg.selectAll('.country')
            .transition()
            .duration(700)
            .delay(d => {
                const id = +d.id;
                if (been.has(id))     return 2 * 320 + Math.random() * 180;
                if (wantToGo.has(id)) return 1 * 320 + Math.random() * 180;
                return Math.random() * 180;
            })
            .attr('opacity', 1);

        // Border mesh
        borderElem = svg.append('path')
            .datum(bordersDatum)
            .attr('class', 'borders')
            .attr('fill', 'none')
            .attr('stroke', '#fff')
            .attr('stroke-width', 0.4)
            .attr('d', initPath);
    });
    </script>
</body>
</html>
