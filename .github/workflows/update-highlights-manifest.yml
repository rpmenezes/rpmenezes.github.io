name: Update Highlights Manifest

on:
  push:
    paths:
      - 'highlights/**.html'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, to date each page by when it was added

      - name: Generate manifest.json
        run: |
          # Newest highlight first: order pages by the commit that first added them.
          for f in highlights/*.html; do
            added=$(git log --diff-filter=A --follow --format=%at -1 -- "$f")
            echo "${added:-$(date +%s)} $(basename "$f" .html)"
          done | sort -rn | cut -d' ' -f2 | jq -R . | jq -s . > highlights/manifest.json
          cat highlights/manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/manifest.json
          git diff --staged --quiet || git commit -m "Update highlights manifest"
          git pull --rebase
          git push
