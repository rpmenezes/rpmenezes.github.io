name: Update Highlights Manifest

on:
  push:
    paths:
      - 'highlights/**.html'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          slugs=$(find highlights -maxdepth 1 -name "*.html" | sort | sed 's|highlights/||; s|\.html||' | jq -R . | jq -s .)
          echo "$slugs" > highlights/manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/manifest.json
          git diff --staged --quiet || git commit -m "Update highlights manifest"
          git pull --rebase
          git push
