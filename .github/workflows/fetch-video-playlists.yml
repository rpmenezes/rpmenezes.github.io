name: Fetch Video Playlists

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  fetch-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch playlists from YouTube API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - << EOF
          import urllib.request, json, os, datetime

          api_key = os.environ['YOUTUBE_API_KEY']

          def fetch_playlist(playlist_id):
              # Page through the ENTIRE playlist (API returns max 50 per page).
              # contentDetails carries videoPublishedAt — the true upload date,
              # unlike snippet.publishedAt which is when the item was added.
              items, page_token = [], ''
              while True:
                  url = ('https://www.googleapis.com/youtube/v3/playlistItems'
                         '?part=snippet,contentDetails&maxResults=50'
                         '&playlistId=' + playlist_id +
                         (('&pageToken=' + page_token) if page_token else '') +
                         '&key=' + api_key)
                  with urllib.request.urlopen(url) as r:
                      data = json.loads(r.read())
                  items.extend(data.get('items', []))
                  page_token = data.get('nextPageToken')
                  if not page_token:
                      break
              return items

          def fetch_view_counts(video_ids):
              # The videos endpoint accepts at most 50 ids per call — batch them.
              counts = {}
              for i in range(0, len(video_ids), 50):
                  chunk = video_ids[i:i+50]
                  url = ('https://www.googleapis.com/youtube/v3/videos'
                         '?part=statistics&id=' + ','.join(chunk) +
                         '&key=' + api_key)
                  with urllib.request.urlopen(url) as r:
                      data = json.loads(r.read())
                  for v in data.get('items', []):
                      counts[v['id']] = int(v['statistics'].get('viewCount', 0))
              return counts

          os.makedirs('data', exist_ok=True)
          updated = datetime.datetime.utcnow().isoformat()

          # ── Guitar playlist (top 5 most viewed + top 5 most recent) ──
          guitar_items = fetch_playlist('PLL_czV5M6TkEhcd81hnsFBQ8qBLyyCpdH')
          guitar_ids = [i['snippet']['resourceId']['videoId'] for i in guitar_items]
          guitar_stats = fetch_view_counts(guitar_ids)

          guitar_videos = []
          for item in guitar_items:
              s = item['snippet']
              vid = s['resourceId']['videoId']
              # videoPublishedAt = actual upload date; fall back to snippet date
              uploaded = item.get('contentDetails', {}).get('videoPublishedAt') or s['publishedAt']
              guitar_videos.append({
                  'rawTitle': s['title'],
                  'videoId': vid,
                  'url': 'https://www.youtube.com/watch?v=' + vid,
                  'publishedAt': uploaded,
                  'viewCount': guitar_stats.get(vid, 0),
              })

          most_viewed = sorted(guitar_videos, key=lambda x: x['viewCount'], reverse=True)[:5]
          most_recent = sorted(guitar_videos, key=lambda x: x['publishedAt'], reverse=True)[:5]

          with open('data/auto/guitar-playlist.json', 'w') as f:
              json.dump({'mostViewed': most_viewed, 'mostRecent': most_recent, 'updated': updated}, f, indent=2)
          print('Guitar: saved', len(most_viewed), 'most-viewed +', len(most_recent), 'most-recent')

          # ── Professional playlist (sort by newest, top 5) ──
          prof_items = fetch_playlist('PLL_czV5M6TkFiY6nctp8mBdF2Q3AmzXmd')
          prof_ids = [i['snippet']['resourceId']['videoId'] for i in prof_items]
          prof_stats = fetch_view_counts(prof_ids)

          prof_videos = []
          for item in prof_items:
              s = item['snippet']
              vid = s['resourceId']['videoId']
              prof_videos.append({
                  'rawTitle': s['title'],
                  'videoId': vid,
                  'url': 'https://www.youtube.com/watch?v=' + vid,
                  'publishedAt': s['publishedAt'],
                  'viewCount': prof_stats.get(vid, 0),
              })
          prof_videos.sort(key=lambda x: x['publishedAt'], reverse=True)
          prof_videos = prof_videos[:5]

          with open('data/auto/professional-playlist.json', 'w') as f:
              json.dump({'videos': prof_videos, 'updated': updated}, f, indent=2)
          print('Professional: saved', len(prof_videos), 'videos')
          for v in prof_videos:
              print(' ', v['publishedAt'][:10], v['rawTitle'])

          # ── NotebookLM playlist (sort by newest, top 5) ──
          notebooklm_items = fetch_playlist('PLL_czV5M6TkH6dYjYANrN2pi8lnbiD5-H')
          notebooklm_ids = [i['snippet']['resourceId']['videoId'] for i in notebooklm_items]
          notebooklm_stats = fetch_view_counts(notebooklm_ids)

          notebooklm_videos = []
          for item in notebooklm_items:
              s = item['snippet']
              vid = s['resourceId']['videoId']
              notebooklm_videos.append({
                  'rawTitle': s['title'],
                  'description': s.get('description', ''),
                  'videoId': vid,
                  'url': 'https://www.youtube.com/watch?v=' + vid,
                  'publishedAt': s['publishedAt'],
                  'viewCount': notebooklm_stats.get(vid, 0),
              })
          notebooklm_videos.sort(key=lambda x: x['publishedAt'], reverse=True)
          notebooklm_videos = notebooklm_videos[:5]

          with open('data/auto/notebooklm-playlist.json', 'w') as f:
              json.dump({'videos': notebooklm_videos, 'updated': updated}, f, indent=2)
          print('NotebookLM: saved', len(notebooklm_videos), 'videos')
          for v in notebooklm_videos:
              print(' ', v['publishedAt'][:10], v['rawTitle'])
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto/guitar-playlist.json data/auto/professional-playlist.json data/auto/notebooklm-playlist.json
          git diff --staged --quiet || git commit -m "Update video playlist data"
          git pull --rebase
          git push
