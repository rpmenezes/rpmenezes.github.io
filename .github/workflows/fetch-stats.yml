name: Fetch Academic Stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Semantic Scholar author stats
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            curl -s "https://api.semanticscholar.org/graph/v1/author/145351935?fields=name,citationCount,hIndex,paperCount" \
              -H "Accept: application/json" \
              -o /tmp/s2_author.json
            echo "Semantic Scholar author response:"
            cat /tmp/s2_author.json
            # Check if we got valid data (paperCount not null)
            if python3 -c "import json; d=json.load(open('/tmp/s2_author.json')); assert d.get('paperCount') is not None"; then
              echo "Valid data received."
              break
            fi
            echo "Rate limited or null data, waiting 30s before retry..."
            sleep 30
          done

      - name: Fetch Semantic Scholar papers with authors
        run: |
          curl -s "https://api.semanticscholar.org/graph/v1/author/145351935/papers?fields=influentialCitationCount,authors,title,year&limit=1000" \
            -H "Accept: application/json" \
            -o /tmp/s2_papers.json
          echo "Semantic Scholar papers fetched"

      - name: Fetch ORCID publications
        run: |
          curl -s "https://pub.orcid.org/v3.0/0000-0002-6479-6429/works" \
            -H "Accept: application/json" \
            -o /tmp/orcid_works.json
          echo "ORCID works fetched"

      - name: Build combined stats JSON
        run: |
          python3 << 'EOF'
          import json, os
          from datetime import datetime, timezone

          with open('/tmp/s2_author.json') as f:
              s2 = json.load(f)

          try:
              with open('/tmp/s2_papers.json') as f:
                  s2_papers = json.load(f)
              influential = sum(p.get('influentialCitationCount', 0) or 0 for p in s2_papers.get('data', []))
          except:
              influential = None

          with open('/tmp/orcid_works.json') as f:
              orcid = json.load(f)

          current_year = datetime.now(timezone.utc).year
          min_year = current_year - 4

          groups = orcid.get('group', [])
          recent = []
          for g in groups:
              summary = g['work-summary'][0]
              year_val = summary.get('publication-date') or {}
              year = int((year_val.get('year') or {}).get('value', 0) or 0)
              if year >= min_year:
                  recent.append(g)

          output = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'stats': {
                  'paperCount': s2.get('paperCount'),
                  'hIndex': s2.get('hIndex'),
                  'citationCount': s2.get('citationCount'),
                  'influentialCitationCount': influential,
              },
              'recentWorks': recent
          }

          os.makedirs('data', exist_ok=True)
          with open('data/auto/stats.json', 'w') as f:
              json.dump(output, f, indent=2)

          print(f"Stats: {output['stats']}")
          print(f"Recent works: {len(recent)}")
          EOF

      - name: Fetch full work details and citations
        run: |
          python3 << 'EOF'
          import json, urllib.request, time, os

          with open('data/auto/stats.json') as f:
              data = json.load(f)

          ORCID_ID = '0000-0002-6479-6429'
          enriched = []

          for g in data['recentWorks']:
              summary = g['work-summary'][0]
              put_code = summary['put-code']
              year = ((summary.get('publication-date') or {}).get('year') or {}).get('value', 'Unknown')

              try:
                  url = f"https://pub.orcid.org/v3.0/{ORCID_ID}/work/{put_code}"
                  req = urllib.request.Request(url, headers={'Accept': 'application/json'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      full = json.loads(r.read())
              except Exception as e:
                  print(f"Failed to fetch work {put_code}: {e}")
                  continue

              title = ((full.get('title') or {}).get('title') or {}).get('value', 'Untitled')
              work_type = full.get('type', '')
              journal = full.get('journal-title', {}).get('value', '') if full.get('journal-title') else ''

              if not journal and work_type:
                  labels = {
                      'conference-paper': 'Conference Paper',
                      'conference-abstract': 'Conference Abstract',
                      'conference-poster': 'Conference Poster',
                      'book-chapter': 'Book Chapter',
                      'book': 'Book',
                      'edited-book': 'Edited Book',
                      'report': 'Report',
                      'preprint': 'Preprint',
                      'dissertation': 'Dissertation',
                      'journal-article': '',
                  }
                  journal = labels.get(work_type, work_type.replace('-', ' '))

              contributors = full.get('contributors', {}).get('contributor', [])
              authors = []
              for c in contributors:
                  role = (c.get('contributor-attributes') or {}).get('contributor-role', 'author')
                  if role == 'author' or not c.get('contributor-attributes'):
                      name = (c.get('credit-name') or {}).get('value', '')
                      if name:
                          authors.append(name)

              ids = (full.get('external-ids') or {}).get('external-id', [])
              doi_entry = next((i for i in ids if i['external-id-type'] == 'doi'), None)
              doi_value = doi_entry['external-id-value'] if doi_entry else None
              doi_url = f"https://doi.org/{doi_value}" if doi_value else ((full.get('url') or {}).get('value') or None)

              citation_count = None
              if doi_value:
                  try:
                      url = f"https://api.semanticscholar.org/graph/v1/paper/DOI:{doi_value}?fields=citationCount"
                      req = urllib.request.Request(url, headers={'Accept': 'application/json'})
                      with urllib.request.urlopen(req, timeout=10) as r:
                          s2data = json.loads(r.read())
                          citation_count = s2data.get('citationCount')
                      time.sleep(0.5)
                  except Exception as e:
                      print(f"S2 citation fetch failed for {doi_value}: {e}")

              enriched.append({
                  'year': year,
                  'title': title,
                  'authors': authors,
                  'venue': journal,
                  'doiValue': doi_value,
                  'doiUrl': doi_url,
                  'citationCount': citation_count,
              })
              time.sleep(0.3)

          data['publications'] = enriched
          del data['recentWorks']

          with open('data/auto/stats.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Enriched {len(enriched)} publications")
          EOF

      - name: Build collaborator network data
        run: |
          python3 << 'EOF'
          import json

          RONALDO_ID = "145351935"

          with open('/tmp/s2_papers.json') as f:
              s2_papers = json.load(f)

          collab_map = {}

          for paper in s2_papers.get('data', []):
              authors = paper.get('authors', [])
              author_ids = [a.get('authorId', '') for a in authors]

              # Skip papers where Ronaldo is not listed as author
              if RONALDO_ID not in author_ids:
                  continue

              year = paper.get('year')
              title = paper.get('title', '')
              paper_id = paper.get('paperId', '')

              for author in authors:
                  aid = author.get('authorId', '')
                  if not aid or aid == RONALDO_ID:
                      continue

                  if aid not in collab_map:
                      collab_map[aid] = {
                          'name': author.get('name', ''),
                          'collaborationCount': 0,
                          'firstCollabYear': None,
                          'lastCollabYear': None,
                          'sharedPapers': []
                      }

                  c = collab_map[aid]
                  c['name'] = author.get('name', '')
                  c['collaborationCount'] += 1
                  if year:
                      if c['firstCollabYear'] is None or year < c['firstCollabYear']:
                          c['firstCollabYear'] = year
                      if c['lastCollabYear'] is None or year > c['lastCollabYear']:
                          c['lastCollabYear'] = year
                  c['sharedPapers'].append({
                      'paperId': paper_id,
                      'title': title,
                      'year': year
                  })

          # Deduplicate by first-initial + last-name key, but ONLY when at least
          # one entry uses an abbreviated first name (e.g. "N. Iyer" or "M. Macedo").
          # This prevents "Mahdi X" from being incorrectly merged with "Marcus X".
          def is_initial(word):
              """Single letter, optionally followed by a period — e.g. 'M' or 'M.'"""
              return len(word.rstrip('.')) == 1

          def dedup_key(name):
              parts = name.strip().split()
              if not parts:
                  return ''
              last  = parts[-1].lower().rstrip('.')
              first = parts[0][0].lower() if parts[0] else ''
              return f"{first}_{last}"

          key_to_primary = {}
          to_delete = []
          for aid, info in list(collab_map.items()):
              key = dedup_key(info['name'])
              if not key:
                  continue
              if key in key_to_primary:
                  primary = key_to_primary[key]
                  pri = collab_map[primary]
                  # Safety check: only merge when at least one side has an abbreviated
                  # first name — prevents collapsing two different people who share
                  # an initial and a last name (e.g. "Mahdi X" vs "Marcos X")
                  info_first = info['name'].strip().split()[0]
                  pri_first  = pri['name'].strip().split()[0]
                  if not (is_initial(info_first) or is_initial(pri_first)):
                      continue  # both full names, different people — leave separate
                  # Prefer the longer (more complete) name
                  if len(info['name']) > len(pri['name']):
                      pri['name'] = info['name']
                  pri['collaborationCount'] += info['collaborationCount']
                  if info['firstCollabYear'] and (pri['firstCollabYear'] is None or info['firstCollabYear'] < pri['firstCollabYear']):
                      pri['firstCollabYear'] = info['firstCollabYear']
                  if info['lastCollabYear'] and (pri['lastCollabYear'] is None or info['lastCollabYear'] > pri['lastCollabYear']):
                      pri['lastCollabYear'] = info['lastCollabYear']
                  seen = {p['paperId'] for p in pri['sharedPapers']}
                  for paper in info['sharedPapers']:
                      if paper['paperId'] not in seen:
                          pri['sharedPapers'].append(paper)
                          seen.add(paper['paperId'])
                  to_delete.append(aid)
              else:
                  key_to_primary[key] = aid
          for aid in to_delete:
              del collab_map[aid]
          if to_delete:
              print(f"Merged {len(to_delete)} duplicate author entries")

          # Sort by collaboration count descending
          collaborators = sorted(
              [{'authorId': aid, **data} for aid, data in collab_map.items()],
              key=lambda x: x['collaborationCount'],
              reverse=True
          )

          from datetime import datetime, timezone

          output = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'collaborators': collaborators
          }

          with open('data/auto/collaborators.json', 'w') as f:
              json.dump(output, f, indent=2)

          print(f"Collaborators found: {len(collaborators)}")
          if collaborators:
              print(f"Top collaborator: {collaborators[0]['name']} ({collaborators[0]['collaborationCount']} papers)")
          EOF

      - name: Commit and push stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto/stats.json data/auto/collaborators.json
          git diff --staged --quiet || git commit -m "Update academic stats [$(date -u +%Y-%m-%d)]"
          git pull --rebase
          git push
