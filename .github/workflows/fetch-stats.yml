name: Fetch Academic Stats

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Mondays at 6am UTC (an hour after Fetch Citations)
  workflow_dispatch:

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch Semantic Scholar author stats
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            curl -s "https://api.semanticscholar.org/graph/v1/author/145351935?fields=name,citationCount,hIndex,paperCount" \
              -H "Accept: application/json" \
              -o /tmp/s2_author.json
            echo "Semantic Scholar author response:"
            cat /tmp/s2_author.json
            # Check if we got valid data (paperCount not null)
            if python3 -c "import json; d=json.load(open('/tmp/s2_author.json')); assert d.get('paperCount') is not None"; then
              echo "Valid data received."
              break
            fi
            echo "Rate limited or null data, waiting 30s before retry..."
            sleep 30
          done

      - name: Fetch Semantic Scholar papers with authors
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            curl -s "https://api.semanticscholar.org/graph/v1/author/145351935/papers?fields=influentialCitationCount,authors,title,year&limit=1000" \
              -H "Accept: application/json" \
              -o /tmp/s2_papers.json
            if python3 -c "import json; d=json.load(open('/tmp/s2_papers.json')); assert isinstance(d.get('data'), list)"; then
              echo "Valid papers data received."
              break
            fi
            echo "Rate limited or invalid data, waiting 30s before retry..."
            sleep 30
          done

      - name: Fetch collaborators' full names
        # Semantic Scholar often stores names as "G. Ghoshal"; its link to DBLP
        # usually carries the full name ("Gourab Ghoshal"). Optional: if this
        # fails, the network keeps the names as Semantic Scholar has them.
        continue-on-error: true
        run: |
          python3 << 'EOF'
          import json, time, urllib.request

          papers = json.load(open('/tmp/s2_papers.json')).get('data', [])
          ids = sorted({a['authorId'] for p in papers for a in p.get('authors', []) if a.get('authorId')})
          names = {}
          for start in range(0, len(ids), 500):
              chunk = ids[start:start + 500]
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(
                          'https://api.semanticscholar.org/graph/v1/author/batch?fields=name,externalIds',
                          data=json.dumps({'ids': chunk}).encode(),
                          headers={'Content-Type': 'application/json'})
                      for a in json.load(urllib.request.urlopen(req, timeout=60)):
                          dblp = ((a or {}).get('externalIds') or {}).get('DBLP') or []
                          if dblp:
                              names[a['authorId']] = dblp[0]
                      break
                  except Exception as e:
                      print(f'Attempt {attempt + 1} failed: {e}')
                      time.sleep(30)
          json.dump(names, open('/tmp/s2_names.json', 'w'))
          print(f'Full names found for {len(names)} of {len(ids)} authors')
          EOF

      - name: Fetch ORCID publications
        run: |
          # Retry until the response is valid JSON with a works list; a failed
          # fetch would otherwise leave an empty/error body for the build step.
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            curl -s --max-time 60 "https://pub.orcid.org/v3.0/0000-0002-6479-6429/works" \
              -H "Accept: application/json" \
              -o /tmp/orcid_works.json
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/orcid_works.json')).get('group') else 1)" 2>/dev/null; then
              echo "ORCID works fetched"
              break
            fi
            echo "ORCID response not usable, retrying..."
            sleep 30
          done

      - name: Build combined stats JSON
        run: |
          python3 << 'EOF'
          import json, os
          from datetime import datetime, timezone

          with open('/tmp/s2_author.json') as f:
              s2 = json.load(f)

          try:
              with open('/tmp/s2_papers.json') as f:
                  s2_papers = json.load(f)
              influential = sum(p.get('influentialCitationCount', 0) or 0 for p in s2_papers.get('data', []))
          except:
              influential = None

          with open('/tmp/orcid_works.json') as f:
              orcid = json.load(f)

          current_year = datetime.now(timezone.utc).year
          min_year = current_year - 4

          groups = orcid.get('group', [])
          recent = []
          for g in groups:
              summary = g['work-summary'][0]
              year_val = summary.get('publication-date') or {}
              year = int((year_val.get('year') or {}).get('value', 0) or 0)
              if year >= min_year:
                  recent.append(g)

          # Guard: abort if core stats are null (API failure), preserving last good file
          if s2.get('paperCount') is None or s2.get('hIndex') is None:
              print("ERROR: Core stats missing — aborting to preserve last good stats.json")
              raise SystemExit(1)

          # Preserve the last good publications array so a transient ORCID/S2
          # failure during enrichment can fall back to it instead of wiping it.
          prev_pubs = []
          try:
              with open('data/auto/stats.json') as f:
                  prev_pubs = json.load(f).get('publications', []) or []
          except Exception:
              prev_pubs = []

          output = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'stats': {
                  'paperCount': s2.get('paperCount'),
                  'hIndex': s2.get('hIndex'),
                  'citationCount': s2.get('citationCount'),
                  'influentialCitationCount': influential,
              },
              'recentWorks': recent,
              '_prevPublications': prev_pubs
          }

          os.makedirs('data', exist_ok=True)
          with open('data/auto/stats.json', 'w') as f:
              json.dump(output, f, indent=2)

          print(f"Stats: {output['stats']}")
          print(f"Recent works: {len(recent)}")
          EOF

      - name: Fetch full work details and citations
        run: |
          python3 << 'EOF'
          import json, urllib.request, time, os

          with open('data/auto/stats.json') as f:
              data = json.load(f)

          ORCID_ID = '0000-0002-6479-6429'
          enriched = []

          for g in data['recentWorks']:
              summary = g['work-summary'][0]
              put_code = summary['put-code']
              year = ((summary.get('publication-date') or {}).get('year') or {}).get('value', 'Unknown')

              try:
                  url = f"https://pub.orcid.org/v3.0/{ORCID_ID}/work/{put_code}"
                  req = urllib.request.Request(url, headers={'Accept': 'application/json'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      full = json.loads(r.read())
              except Exception as e:
                  print(f"Failed to fetch work {put_code}: {e}")
                  continue

              title = ((full.get('title') or {}).get('title') or {}).get('value', 'Untitled')
              work_type = full.get('type', '')
              journal = full.get('journal-title', {}).get('value', '') if full.get('journal-title') else ''

              if not journal and work_type:
                  labels = {
                      'conference-paper': 'Conference Paper',
                      'conference-abstract': 'Conference Abstract',
                      'conference-poster': 'Conference Poster',
                      'book-chapter': 'Book Chapter',
                      'book': 'Book',
                      'edited-book': 'Edited Book',
                      'report': 'Report',
                      'preprint': 'Preprint',
                      'dissertation': 'Dissertation',
                      'journal-article': '',
                  }
                  journal = labels.get(work_type, work_type.replace('-', ' '))

              contributors = full.get('contributors', {}).get('contributor', [])
              authors = []
              for c in contributors:
                  role = (c.get('contributor-attributes') or {}).get('contributor-role', 'author')
                  if role == 'author' or not c.get('contributor-attributes'):
                      name = (c.get('credit-name') or {}).get('value', '')
                      if name:
                          authors.append(name)

              ids = (full.get('external-ids') or {}).get('external-id', [])
              doi_entry = next((i for i in ids if i['external-id-type'] == 'doi'), None)
              doi_value = doi_entry['external-id-value'] if doi_entry else None
              doi_url = f"https://doi.org/{doi_value}" if doi_value else ((full.get('url') or {}).get('value') or None)

              citation_count = None
              if doi_value:
                  try:
                      url = f"https://api.semanticscholar.org/graph/v1/paper/DOI:{doi_value}?fields=citationCount"
                      req = urllib.request.Request(url, headers={'Accept': 'application/json'})
                      with urllib.request.urlopen(req, timeout=10) as r:
                          s2data = json.loads(r.read())
                          citation_count = s2data.get('citationCount')
                      time.sleep(0.5)
                  except Exception as e:
                      print(f"S2 citation fetch failed for {doi_value}: {e}")

              enriched.append({
                  'year': year,
                  'title': title,
                  'authors': authors,
                  'venue': journal,
                  'doiValue': doi_value,
                  'doiUrl': doi_url,
                  'citationCount': citation_count,
              })
              time.sleep(0.3)

          prev_pubs = data.pop('_prevPublications', []) or []

          # Guard: if enrichment produced nothing (transient ORCID/S2 failure)
          # but we had publications before, keep the last good array rather than
          # wiping the homepage highlights.
          if not enriched and prev_pubs:
              print(f"Enrichment empty — preserving {len(prev_pubs)} previous publications")
              data['publications'] = prev_pubs
          else:
              data['publications'] = enriched
          del data['recentWorks']

          with open('data/auto/stats.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Enriched {len(enriched)} publications; wrote {len(data['publications'])}")
          EOF

      - name: Build collaborator network data
        run: |
          python3 << 'EOF'
          import json

          RONALDO_ID = "145351935"

          with open('/tmp/s2_papers.json') as f:
              s2_papers = json.load(f)

          collab_map = {}

          for paper in s2_papers.get('data', []):
              authors = paper.get('authors', [])
              author_ids = [a.get('authorId', '') for a in authors]

              # Skip papers where Ronaldo is not listed as author
              if RONALDO_ID not in author_ids:
                  continue

              year = paper.get('year')
              title = paper.get('title', '')
              paper_id = paper.get('paperId', '')

              for author in authors:
                  aid = author.get('authorId', '')
                  if not aid or aid == RONALDO_ID:
                      continue

                  if aid not in collab_map:
                      collab_map[aid] = {
                          'name': author.get('name', ''),
                          'collaborationCount': 0,
                          'firstCollabYear': None,
                          'lastCollabYear': None,
                          'sharedPapers': []
                      }

                  c = collab_map[aid]
                  c['name'] = author.get('name', '')
                  c['collaborationCount'] += 1
                  if year:
                      if c['firstCollabYear'] is None or year < c['firstCollabYear']:
                          c['firstCollabYear'] = year
                      if c['lastCollabYear'] is None or year > c['lastCollabYear']:
                          c['lastCollabYear'] = year
                  c['sharedPapers'].append({
                      'paperId': paper_id,
                      'title': title,
                      'year': year
                  })

          # Display names: "First Last". Use the full name from DBLP when it is
          # clearly the same person, then data/manual/collaborator-names.json
          # (keyed by authorId or by the name as Semantic Scholar has it) for
          # anything automatic matching can't fix, e.g. "M. Oliveira-Junior".
          import re, unicodedata

          def norm(word):
              word = unicodedata.normalize('NFKD', word).encode('ascii', 'ignore').decode()
              return ''.join(ch for ch in word.lower() if ch.isalpha())

          def name_parts(name):
              parts = [p for p in name.strip().split() if norm(p)]
              return (norm(parts[0]), norm(parts[-1])) if parts else ('', '')

          def first_last(name):
              parts = re.sub(r'\s+\d{4}$', '', name).split()   # DBLP adds " 0001" to tell namesakes apart
              if len(parts) < 2:
                  return name.strip()
              particles = {'de', 'da', 'do', 'dos', 'das', 'di', 'del', 'della', 'van', 'von', 'der', 'la', 'le', 'e'}
              first = next((p for p in parts[:-1] if len(p.rstrip('.')) > 1 and p.lower() not in particles), parts[0])
              return f'{first} {parts[-1]}'

          try:
              full_names = json.load(open('/tmp/s2_names.json'))
          except Exception:
              full_names = {}
          try:
              overrides = {k: v for k, v in json.load(open('data/manual/collaborator-names.json')).items()
                           if not k.startswith('_')}
          except Exception:
              overrides = {}

          for aid, c in collab_map.items():
              s2_name = c['name']
              best = s2_name
              dblp = re.sub(r'\s+\d{4}$', '', full_names.get(aid, ''))
              if dblp:
                  fs, ls = name_parts(s2_name)
                  fd, ld = name_parts(dblp)
                  if fs and fd and ls == ld and fs[0] == fd[0]:
                      best = dblp
              c['name'] = overrides.get(aid) or overrides.get(s2_name) or first_last(best)

          # Semantic Scholar often splits one person across several author IDs
          # ("Mariana Macedo" x3, "Marcos A. C. Oliveira" / "Marcos Oliveira").
          # Merge entries with the same first initial + surname when the first
          # names match (ignoring accents, case, hyphens) or one is just an
          # initial. Different first names stay apart ("Xiao-Dong" vs "Xiao-Long").
          def same_person(a, b):
              fa, la = name_parts(a)
              fb, lb = name_parts(b)
              if not fa or not fb or la != lb or fa[0] != fb[0]:
                  return False
              return fa == fb or len(fa) == 1 or len(fb) == 1

          # Biggest entry first, so it becomes the one that others merge into
          order = sorted(collab_map, key=lambda a: -len(collab_map[a]['sharedPapers']))
          to_delete = set()
          for i, primary in enumerate(order):
              if primary in to_delete:
                  continue
              pri = collab_map[primary]
              for other in order[i + 1:]:
                  if other in to_delete or not same_person(pri['name'], collab_map[other]['name']):
                      continue
                  info = collab_map[other]
                  if len(name_parts(pri['name'])[0]) == 1 and len(name_parts(info['name'])[0]) > 1:
                      pri['name'] = info['name']             # prefer a spelled-out first name
                  seen = {p['paperId'] for p in pri['sharedPapers']}
                  pri['sharedPapers'] += [p for p in info['sharedPapers'] if p['paperId'] not in seen]
                  to_delete.add(other)
          for aid in to_delete:
              del collab_map[aid]
          for c in collab_map.values():
              years = [p['year'] for p in c['sharedPapers'] if p.get('year')]
              c['collaborationCount'] = len({p['paperId'] for p in c['sharedPapers']})
              c['firstCollabYear'] = min(years) if years else None
              c['lastCollabYear'] = max(years) if years else None
          if to_delete:
              print(f"Merged {len(to_delete)} duplicate author entries")

          # Sort by collaboration count descending
          collaborators = sorted(
              [{'authorId': aid, **data} for aid, data in collab_map.items()],
              key=lambda x: x['collaborationCount'],
              reverse=True
          )

          from datetime import datetime, timezone

          output = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'collaborators': collaborators
          }

          with open('data/auto/collaborators.json', 'w') as f:
              json.dump(output, f, indent=2)

          print(f"Collaborators found: {len(collaborators)}")
          if collaborators:
              print(f"Top collaborator: {collaborators[0]['name']} ({collaborators[0]['collaborationCount']} papers)")
          EOF

      - name: Commit and push stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto/stats.json data/auto/collaborators.json
          git diff --staged --quiet || git commit -m "Update academic stats [$(date -u +%Y-%m-%d)]"
          git pull --rebase
          git push
