name: Update Sitemap and Link Previews

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  update-site-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, for each page's last-modified date

      - name: Rebuild sitemap.xml and Open Graph tags
        run: python3 .github/scripts/site_meta.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml index.html research.html scholarly-engagement.html about.html videos.html cv.html blog/
          git diff --staged --quiet || git commit -m "Update sitemap and link previews"
          git pull --rebase
          git push
