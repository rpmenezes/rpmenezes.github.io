<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found - Ronaldo Menezes</title>
    <!-- Served for any missing URL, so every path here is root-absolute. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
    <!-- Navigation -->
    <header class="site-header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <h1><a href="/index.html" style="text-decoration:none;color:inherit;">Ronaldo Menezes</a></h1>
                    <p class="nav-subtitle">Professor of Data and Network Science</p>
                </div>
                <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" data-site-nav></ul>
                <script src="/js/site.js"></script>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-row">
                <div class="hero-content">
                    <h1>Page Not Found</h1>
                    <div class="title-divider"></div>
                </div>
                <div class="hero-anim" aria-hidden="true"><canvas></canvas></div>
            </div>
        </section>

        <section class="content-section">
            <p>The page you were looking for doesn't exist or may have moved.</p>
            <p style="margin-top:1.5rem;">
                <a class="btn-primary" href="/index.html">Go to the home page</a>
                <a class="btn-outline" href="/research.html" style="margin-left:0.6rem;">Explore my research</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; <span class="copy-year">2026</span> Ronaldo Menezes | University of Exeter | Department of Computer Science</p>
    </footer>

    <script>
        const toggle = document.querySelector('.nav-toggle');
        const menu = document.querySelector('.nav-menu');
        toggle.addEventListener('click', () => {
            const open = menu.classList.toggle('nav-open');
            toggle.setAttribute('aria-expanded', open);
        });
        menu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menu.classList.remove('nav-open');
                toggle.setAttribute('aria-expanded', false);
            });
        });
    </script>
    <script src="/js/hero-runner.js"></script>
    <script src="/js/hero-network.js"></script>
</body>
</html>
